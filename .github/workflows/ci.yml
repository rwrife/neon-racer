name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PINNED_XCODE_VERSION: "26.6"
  PINNED_XCODE_BUILD: "17F113"
  PINNED_IOS_SIMULATOR_SDK: "26.5"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  core-tests:
    name: Swift package tests (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          sudo xcode-select -s "$DEVELOPER_DIR"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "$PINNED_XCODE_VERSION"
          test "$(xcodebuild -version | sed -n '2s/^Build version //p')" = "$PINNED_XCODE_BUILD"
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "$PINNED_IOS_SIMULATOR_SDK"

      - name: Swift version
        run: swift --version

      - name: Run deterministic simulation tests
        run: xcrun swift test --quiet

  ios-build:
    name: iOS build, tests, and analysis (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Select and verify pinned Xcode and iOS SDK
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          sudo xcode-select -s "$DEVELOPER_DIR"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "$PINNED_XCODE_VERSION"
          test "$(xcodebuild -version | sed -n '2s/^Build version //p')" = "$PINNED_XCODE_BUILD"
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "$PINNED_IOS_SIMULATOR_SDK"
          xcodebuild -showsdks | grep -F "iphonesimulator$PINNED_IOS_SIMULATOR_SDK"

      - name: Validate repository configuration
        run: |
          set -euo pipefail
          plutil -lint NeonRacer/Resources/PrivacyInfo.xcprivacy
          plutil -lint Config/ExportOptions-AppStore.plist
          find NeonRacer/Resources/Assets.xcassets -name Contents.json -print0 \
            | xargs -0 python3 -c \
              'import json, sys; [json.load(open(path)) for path in sys.argv[1:]]'
          xcodebuild -list -json -project NeonRacer.xcodeproj \
            | python3 -m json.tool >/dev/null

      - name: Select pinned iOS simulator runtime
        run: |
          set -euo pipefail
          DEVICE_UDID="$(
            xcrun simctl list devices available --json \
              | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          suffix = "iOS-" + os.environ["PINNED_IOS_SIMULATOR_SDK"].replace(".", "-")
          runtime = next((key for key in sorted(devices) if key.endswith(suffix)), None)
          if runtime is None:
              raise SystemExit(f"The pinned iOS simulator runtime {suffix} is unavailable")
          iphone = next((device for device in devices[runtime] if device["name"] == "iPhone 17 Pro"), None)
          if iphone is None:
              iphone = next((device for device in devices[runtime] if device["name"].startswith("iPhone")), None)
          if iphone is None:
              raise SystemExit("No available iPhone exists in the pinned iOS runtime")
          print(iphone["udid"])
          '
          )"
          echo "DEVICE_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

      - name: Build app and tests for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project NeonRacer.xcodeproj \
            -scheme NeonRacer \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Run unit and selected UI tests
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project NeonRacer.xcodeproj \
            -scheme NeonRacer \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -only-testing:NeonRacerTests \
            -only-testing:NeonRacerUITests/NeonRacerUITests/testLaunchesRaceFromMainMenu \
            -only-testing:NeonRacerUITests/NeonRacerUITests/testGarageShowsVehicleComparisonAndCustomizationScreen \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Run static analyzer
        run: |
          set -euo pipefail
          xcodebuild analyze \
            -project NeonRacer.xcodeproj \
            -scheme NeonRacer \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Verify release bundle identity
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Build/Products/Debug-iphonesimulator/NeonRacer.app' -print -quit)
          test -n "$APP"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")" = "com.infinityball.neon-racer"
          test "$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist")" = "CyberRun"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")" = "1.0"
          FAMILY=$(plutil -extract UIDeviceFamily json -o - "$APP/Info.plist")
          test "$FAMILY" = '[1,2]'
          test -f "$APP/PrivacyInfo.xcprivacy"
          echo "Built bundle: $APP"
          echo "CFBundleIdentifier: com.infinityball.neon-racer"
          echo "UIDeviceFamily: $FAMILY"
          echo "Privacy manifest: present"

      - name: Clean up simulator
        if: always()
        run: |
          if [ -n "${DEVICE_UDID:-}" ]; then
            xcrun simctl shutdown "$DEVICE_UDID" || true
          fi

  release-readiness:
    name: Release readiness gate (physical-device sign-off)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify physical-device performance sign-off
        run: |
          set -euo pipefail
          bash scripts/check_device_signoff.sh
