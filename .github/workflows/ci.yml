name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core simulation (Linux Swift 6.2)
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-noble
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Run deterministic simulation tests
        run: swift test

  ios-build:
    name: iOS build, tests, and analysis (Xcode 26.0.1)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned Xcode and iOS simulator SDK
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "26.0.1"
          test "$(xcodebuild -version | sed -n '2s/^Build version //p')" = "17A400"
          xcodebuild -showsdks | grep -F 'iphonesimulator26.0'

      - name: Validate repository configuration
        run: |
          set -euo pipefail
          plutil -lint NeonRacer/Resources/PrivacyInfo.xcprivacy
          plutil -lint Config/ExportOptions-AppStore.plist
          find NeonRacer/Resources/Assets.xcassets -name Contents.json -print0 \
            | xargs -0 python3 -c \
              'import json, sys; [json.load(open(path)) for path in sys.argv[1:]]'
          xcodebuild -list -json -project NeonRacer.xcodeproj \
            | python3 -m json.tool >/dev/null

      - name: Select pinned iOS simulator runtime
        run: |
          set -euo pipefail
          DEVICE_UDID="$(
            xcrun simctl list devices available --json \
              | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtime = next((key for key in devices if key.endswith("iOS-26-0")), None)
          if runtime is None:
              raise SystemExit("The pinned iOS 26.0 simulator runtime is unavailable")
          iphone = next((device for device in devices[runtime] if device["name"].startswith("iPhone")), None)
          if iphone is None:
              raise SystemExit("No available iPhone exists in the iOS 26.0 runtime")
          print(iphone["udid"])
          '
          )"
          echo "DEVICE_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

      - name: Build app and tests for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project NeonRacer.xcodeproj \
            -scheme NeonRacer \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Run unit and selected UI tests
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project NeonRacer.xcodeproj \
            -scheme NeonRacer \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -only-testing:NeonRacerTests \
            -only-testing:NeonRacerUITests/NeonRacerUITests/testLaunchesRaceFromMainMenu \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Run static analyzer
        run: |
          set -euo pipefail
          xcodebuild analyze \
            -project NeonRacer.xcodeproj \
            -scheme NeonRacer \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Verify iPhone-only bundle identity
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Build/Products/Debug-iphonesimulator/NeonRacer.app' -print -quit)
          test -n "$APP"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")" = "com.infinityball.neonracer"
          FAMILY=$(plutil -extract UIDeviceFamily json -o - "$APP/Info.plist")
          test "$FAMILY" = '[1]'
          echo "Built bundle: $APP"
          echo "CFBundleIdentifier: com.infinityball.neonracer"
          echo "UIDeviceFamily: $FAMILY"
          echo "iOS build contract: PASS"
